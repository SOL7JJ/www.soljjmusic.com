<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat with AI - Sol JJ</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css"
      integrity="sha384-1q8mTJOASx8j1Au+a5WDVnPi2lkFfwwEAa8hDDdjZlpLegxhjVME1fgjWPGmkzs7"
      crossorigin="anonymous"
    />
    <script
      src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"
      integrity="sha384-0mSbJDEHialfmuBBQP6A4Qrprq5OVfW37PRR3j5ELqxss1yVqOtnepnHVP9aJ7xS"
      crossorigin="anonymous"
    ></script>
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background-color: #f8f9fa;
        margin: 0;
        text-align: center;
      }

      header {
        background-color: #4338ca;
        color: white;
        padding: 20px 0;
      }

      nav button {
        background-color: white;
        color: #4338ca;
        border: none;
        margin: 5px;
        padding: 10px 20px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      nav button:hover {
        background-color: #e0e7ff;
        transform: translateY(-2px);
      }

      #main-page {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 80vh;
      }

      h2 {
        font-size: 2.5rem;
        color: #1d4ed8;
        margin-bottom: 30px;
      }

      .chat-btn {
        background-color: #4f46e5;
        color: white;
        padding: 20px 40px;
        border-radius: 50px;
        text-decoration: none;
        font-size: 1.5rem;
        font-weight: bold;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
      }

      .chat-btn:hover {
        background-color: #3730a3;
        transform: translateY(-5px);
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Jonathan Elie "Sol JJ"</h1>
      <nav>
        <button onclick="location.href='index.html'">HOME</button>
        <button onclick="location.href='songs.html'">SONGS</button>
        <button onclick="location.href='videos.html'">VIDEOS</button>
        <button onclick="location.href='musiclessons.html'">
          BOOK MUSIC LESSONS
        </button>
        <button onclick="location.href='exclusivecontent.html'">
          EXCLUSIVE CONTENT
        </button>
        <button onclick="location.href='chatwithai.html'">CHAT WITH AI</button>
      </nav>
    </header>

    <section id="main-page">
      <h2>Chat with AI</h2>
      <a
        href="https://chat.openai.com/"
        target="_blank"
        rel="noopener noreferrer"
        class="chat-btn"
      >
        Start Chatting
      </a>
    </section>
  </body>
</html>
